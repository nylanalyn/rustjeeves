# Standalone workspace so the root workspace does not build this WASM crate.
[workspace]

[package]
name = "translate"
version = "0.1.0"
edition = "2021"
description = "DeepL translation module for rustjeeves (!tr, !translate)"

[lib]
crate-type = ["cdylib"]

[dependencies]
extism-pdk = "1.4"
jeeves-abi = { path = "../../crates/jeeves-abi" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
whatlang = "0.16.4"

[profile.release]
opt-level = "s"
lto = true
