# Standalone workspace for the !animal WASM module.
[workspace]

[package]
name = "animal"
version = "0.1.0"
edition = "2021"
description = "Random animal pictures for rustjeeves (!animal, !pug, !capy, ...)"

[lib]
crate-type = ["cdylib"]

[dependencies]
extism-pdk = "1.4"
jeeves-abi = { path = "../../crates/jeeves-abi" }
jeeves-guest = { path = "../../crates/jeeves-guest" }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
