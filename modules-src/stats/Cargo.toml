[workspace]

[package]
name = "stats"
version = "0.1.0"
edition = "2021"
description = "Channel stats: who talks, when, and how (rustjeeves)"

[lib]
crate-type = ["cdylib"]

[dependencies]
extism-pdk = "1.4"
jeeves-abi = { path = "../../crates/jeeves-abi" }
jeeves-guest = { path = "../../crates/jeeves-guest" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
